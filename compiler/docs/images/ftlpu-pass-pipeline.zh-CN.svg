<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
<title id="title">FTLPU IR 与 Pass Pipeline</title>
<desc id="desc">从 StableHLO 经七个 MLIR pass lowering 到 Command IR，再由翻译工具生成二进制并在 Runtime 与 CModel 中执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.head{font:600 17px "Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#172033}.sub{font:400 13px "Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#334155}</style>
<rect width="1600" height="1030" fill="#ffffff"/>
<path d="M 250 96 L 285 96" class="edge"/><path d="M 505 96 L 540 96" class="edge"/><path d="M 760 96 L 795 96" class="edge"/><path d="M 1015 96 L 1050 96" class="edge"/><path d="M 1270 96 L 1305 96" class="edge"/><path d="M 1420 152 L 1420 320" class="edge"/><path d="M 1315 386 L 1280 386" class="edge"/><path d="M 1060 386 L 1025 386" class="edge"/><path d="M 805 386 L 770 386" class="edge"/><path d="M 550 386 L 515 386" class="edge"/><path d="M 295 386 L 260 386" class="edge"/><path d="M 145 442 L 145 610" class="edge"/><path d="M 250 676 L 285 676" class="edge"/><path d="M 505 676 L 540 676" class="edge"/><path d="M 760 676 L 795 676" class="edge"/><path d="M 1015 676 L 1050 676" class="edge"/><path d="M 1270 676 L 1305 676" class="edge"/><path d="M 1420 732 L 1420 870" class="edge"/><path d="M 1315 936 L 1280 936" class="edge"/><g><rect x="40" y="40" width="210" height="112" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="145" y="86.5" text-anchor="middle" class="head">框架前端</text><text x="145" y="107.5" text-anchor="middle" class="sub">ONNX / PyTorch / TensorFlow</text></g><g><rect x="295" y="40" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="400" y="86.5" text-anchor="middle" class="head">IR: StableHLO</text><text x="400" y="107.5" text-anchor="middle" class="sub">模型语义、shape、类型</text></g><g><rect x="550" y="40" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="655" y="76" text-anchor="middle" class="head">Pass 1</text><text x="655" y="97" text-anchor="middle" class="sub">ftlpu-stablehlo-to-kernel</text><text x="655" y="118" text-anchor="middle" class="sub">识别 primitive graph</text></g><g><rect x="805" y="40" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="910" y="86.5" text-anchor="middle" class="head">IR: FTLPU Kernel</text><text x="910" y="107.5" text-anchor="middle" class="sub">LPU primitive graph</text></g><g><rect x="1060" y="40" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="1165" y="65.5" text-anchor="middle" class="head">Pass 2</text><text x="1165" y="86.5" text-anchor="middle" class="sub">ftlpu-kernel-to-tensor</text><text x="1165" y="107.5" text-anchor="middle" class="sub">MEM placement</text><text x="1165" y="128.5" text-anchor="middle" class="sub">--rmsnorm-strategy</text></g><g><rect x="1315" y="40" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="1420" y="86.5" text-anchor="middle" class="head">IR: FTLPU Tensor</text><text x="1420" y="107.5" text-anchor="middle" class="sub">layout / slice / row</text></g><g><rect x="1315" y="330" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="1420" y="366" text-anchor="middle" class="head">Pass 3</text><text x="1420" y="387" text-anchor="middle" class="sub">ftlpu-tensor-to-stream</text><text x="1420" y="408" text-anchor="middle" class="sub">route / queue / endpoint</text></g><g><rect x="1060" y="330" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="1165" y="376.5" text-anchor="middle" class="head">IR: FTLPU Stream</text><text x="1165" y="397.5" text-anchor="middle" class="sub">transport graph</text></g><g><rect x="805" y="330" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="910" y="355.5" text-anchor="middle" class="head">Pass 4</text><text x="910" y="376.5" text-anchor="middle" class="sub">ftlpu-stream-to-schedule</text><text x="910" y="397.5" text-anchor="middle" class="sub">exact-cycle schedule</text><text x="910" y="418.5" text-anchor="middle" class="sub">--ffn-schedule</text></g><g><rect x="550" y="330" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="655" y="376.5" text-anchor="middle" class="head">IR: FTLPU Schedule</text><text x="655" y="397.5" text-anchor="middle" class="sub">未压缩 issue</text></g><g><rect x="295" y="330" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="400" y="366" text-anchor="middle" class="head">Pass 5</text><text x="400" y="387" text-anchor="middle" class="sub">ftlpu-compress-schedule</text><text x="400" y="408" text-anchor="middle" class="sub">wave / repeat</text></g><g><rect x="40" y="330" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="145" y="376.5" text-anchor="middle" class="head">IR: FTLPU Schedule</text><text x="145" y="397.5" text-anchor="middle" class="sub">压缩表示</text></g><g><rect x="40" y="620" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="145" y="656" text-anchor="middle" class="head">Pass 6</text><text x="145" y="677" text-anchor="middle" class="sub">ftlpu-verify-schedule</text><text x="145" y="698" text-anchor="middle" class="sub">逐 cycle 资源校验</text></g><g><rect x="295" y="620" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="400" y="666.5" text-anchor="middle" class="head">IR: FTLPU Schedule</text><text x="400" y="687.5" text-anchor="middle" class="sub">已验证</text></g><g><rect x="550" y="620" width="210" height="112" rx="10" fill="#fff2d6" stroke="#b87500" stroke-width="2"/><text x="655" y="656" text-anchor="middle" class="head">Pass 7</text><text x="655" y="677" text-anchor="middle" class="sub">ftlpu-schedule-to-command</text><text x="655" y="698" text-anchor="middle" class="sub">生成 ICU queue</text></g><g><rect x="805" y="620" width="210" height="112" rx="10" fill="#eaf2ff" stroke="#3977b8" stroke-width="2"/><text x="910" y="666.5" text-anchor="middle" class="head">IR: FTLPU Command</text><text x="910" y="687.5" text-anchor="middle" class="sub">MEM / MXM / VXM / SXM</text></g><g><rect x="1060" y="620" width="210" height="112" rx="10" fill="#f3eefe" stroke="#7655a6" stroke-width="2"/><text x="1165" y="656" text-anchor="middle" class="head">工具（不是 pass）</text><text x="1165" y="677" text-anchor="middle" class="sub">ftlpu-translate</text><text x="1165" y="698" text-anchor="middle" class="sub">Command IR → binary</text></g><g><rect x="1315" y="620" width="210" height="112" rx="10" fill="#e8f7ed" stroke="#2f855a" stroke-width="2"/><text x="1420" y="666.5" text-anchor="middle" class="head">.ftlpu 二进制</text><text x="1420" y="687.5" text-anchor="middle" class="sub">ICU queue + binding ABI</text></g><g><rect x="1315" y="880" width="210" height="112" rx="10" fill="#e7f6f5" stroke="#287b76" stroke-width="2"/><text x="1420" y="926.5" text-anchor="middle" class="head">Runtime</text><text x="1420" y="947.5" text-anchor="middle" class="sub">装载 SRAM / ICU queue</text></g><g><rect x="1060" y="880" width="210" height="112" rx="10" fill="#e7f6f5" stroke="#287b76" stroke-width="2"/><text x="1165" y="926.5" text-anchor="middle" class="head">CModel / 硬件</text><text x="1165" y="947.5" text-anchor="middle" class="sub">逐 cycle 执行</text></g><g><rect x="40" y="880" width="975" height="112" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/><text x="65" y="909" class="head" text-anchor="start">LPUTargetModel 影响范围</text><text x="65" y="940" class="sub" text-anchor="start">P2：placement 与地址约束</text><text x="520" y="940" class="sub" text-anchor="start">P3：route 上限</text><text x="65" y="967" class="sub" text-anchor="start">P4/P6：latency、资源与校验</text><text x="520" y="967" class="sub" text-anchor="start">P7/Runtime：command ABI</text></g>
</svg>